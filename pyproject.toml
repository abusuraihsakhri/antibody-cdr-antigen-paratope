[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antibody-cdr-antigen-paratope"
version = "2.0.0"
description = "Paratope-Mind: Antibody CDR-H3 Loop Modeling & Paratope-Epitope Contact Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
antibody-cdr-antigen-paratope = "paratope_mind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/antibody-cdr-antigen-paratope"
Repository = "https://github.com/abusuraihsakhri/antibody-cdr-antigen-paratope.git"
