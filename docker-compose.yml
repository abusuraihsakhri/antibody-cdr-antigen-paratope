version: '3.8'

services:
  antibody-cdr-antigen-paratope:
    build: .
    container_name: antibody-cdr-antigen-paratope
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=antibody-cdr-antigen-paratope-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
